<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1400" width="2200" height="1400" style="background:#f8fafc; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtri ombra per box entita -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Intestazione Diagramma -->
  <text x="60" y="60" font-size="28" font-weight="700" fill="#0f172a">La Nostra Città, Il Nostro Futuro — Modello Concettuale Entità-Relazioni (ER)</text>
  <text x="60" y="92" font-size="15" fill="#64748b">Schema concettuale del nucleo di dominio (da 04_MODELLO_LOGICO.md) con cardinalità min/max e relazioni associative.</text>

  <!-- ================= RELAZIONI E LINEE DI CONNESSIONE ================= -->

  <!-- 1. UTENTE --- RISIEDE_IN --- QUARTIERE -->
  <line x1="330" y1="260" x2="480" y2="260" stroke="#475569" stroke-width="2.5"/>
  <polygon points="405,235 450,260 405,285 360,260" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="405" y="264" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">RISIEDE_IN</text>
  <!-- Cardinalita -->
  <g filter="url(#badgeShadow)">
    <rect x="345" y="222" width="50" height="24" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="370" y="238" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">(0,N)</text>
    <rect x="425" y="222" width="50" height="24" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="450" y="238" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">(0,1)</text>
  </g>

  <!-- 2. UTENTE --- CREA --- SEGNALAZIONE -->
  <line x1="790" y1="260" x2="1160" y2="260" stroke="#475569" stroke-width="2.5"/>
  <polygon points="975,230 1025,260 975,290 925,260" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="975" y="264" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">CREA</text>
  <g filter="url(#badgeShadow)">
    <rect x="815" y="222" width="50" height="24" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="840" y="238" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">(0,N)</text>
    <rect x="1090" y="222" width="50" height="24" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="1115" y="238" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">(1,1)</text>
  </g>

  <!-- 3. UTENTE --- SOSTIENE --- SEGNALAZIONE (Arco inferiore) -->
  <path d="M 660,530 L 660,620 L 1280,620 L 1280,530" fill="none" stroke="#475569" stroke-width="2.5"/>
  <polygon points="970,585 1025,620 970,655 915,620" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="970" y="624" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">SOSTIENE</text>
  <text x="970" y="675" font-size="11" fill="#475569" text-anchor="middle">[data_sostegno]</text>
  <g filter="url(#badgeShadow)">
